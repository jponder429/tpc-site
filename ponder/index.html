<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0c1d38;--navy-mid:#122548;--navy-light:#1e3a5f;--navy-faint:#263f60;
  --gold:#b8943f;--gold-light:#d4ae6a;--gold-dark:#8a6c2a;--gold-faint:#f5ead6;
  --cream:#f8f5ef;--cream-alt:#f0ebe0;--white:#fff;
  --ink:#0c1d38;--ink-mid:#2a3a50;--ink-light:#5a6e84;--ink-faint:#8a9db0;
  --border:#ddd8cc;--ok:#2f6b4f;--ok-bg:#e6f1ea;--bad:#9a3b32;--bad-bg:#f6e6e3;
  --shadow:0 2px 24px rgba(12,29,56,.10);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--gold-dark)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{background:var(--navy);border-bottom:1px solid var(--navy-light);position:sticky;top:0;z-index:50}
.top-in{max-width:1180px;margin:0 auto;height:60px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:baseline;gap:12px;text-decoration:none}
.brand b{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:22px;color:var(--cream);letter-spacing:-.01em}
.brand b span,.gp{color:var(--gold)}
.brand small{font-size:11px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
.top-r{display:flex;align-items:center;gap:18px;font-size:13px}
.top-r a{color:var(--ink-faint);text-decoration:none}.top-r a:hover{color:var(--cream)}.top-r a.dl{color:var(--cream);border-bottom:1px solid var(--gold)}
.pill{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);padding:4px 10px;border-radius:2px;white-space:nowrap}
.meter{height:3px;background:var(--navy-light)}
.meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}

/* shell */
.shell{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:32px 24px 72px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;align-items:start}
.shell.home{grid-template-columns:minmax(0,1fr)}
.outline{position:sticky;top:96px}
.outline h2{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin-bottom:14px}
.outline ol{list-style:none;border-left:1px solid var(--border)}
.outline li button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:9px 0 9px 16px;margin-left:-1px;border-left:2px solid transparent;color:var(--ink-light);font-size:14px;line-height:1.4}
.outline li button:hover{color:var(--ink)}
.outline li button[aria-current="step"]{border-left-color:var(--gold);color:var(--ink);font-weight:600}
.outline .n{font-family:'DM Mono',monospace;font-size:11px;padding-top:2px;color:var(--ink-faint);min-width:18px}
.outline .done .n{color:var(--ok)}
.outline .bk{display:inline-block;margin-top:22px;font-size:13px;color:var(--ink-light)}
.mobile-bar{display:none}

/* typography */
.eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:14px;display:block}
h1,h2.h,h3{font-family:'Playfair Display',Georgia,serif;color:var(--navy);letter-spacing:-.015em;line-height:1.15}
h1{font-size:clamp(32px,4.6vw,50px);font-weight:800;margin-bottom:18px}
h1 em{font-style:italic;color:var(--gold-dark)}
h2.h{font-size:clamp(26px,3.2vw,34px);font-weight:700;margin-bottom:16px}
h3{font-size:20px;font-weight:700;margin-bottom:8px}
.lede{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(20px,2.2vw,24px);line-height:1.55;color:var(--ink-mid);margin-bottom:24px;max-width:640px}
.prose{max-width:660px}
.prose p{margin-bottom:16px;font-size:17px;color:var(--ink-mid)}
.prose strong{color:var(--ink)}
.muted{color:var(--ink-light);font-size:14px}
.src{font-size:13px;color:var(--ink-light);margin-top:10px}

/* buttons */
.btn{display:inline-block;padding:13px 28px;background:var(--gold);color:var(--navy);border:0;border-radius:2px;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:15px;text-decoration:none;transition:background .2s}
.btn:hover{background:var(--gold-light)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--navy);color:var(--navy)}
.btn.ghost:hover{background:var(--navy);color:var(--cream)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:28px}
.link{background:none;border:0;color:var(--ink-light);font-size:14px;text-decoration:underline;padding:6px 0}

/* home */
.hero{background:var(--navy);margin:-32px -24px 40px;padding:64px 24px 56px;border-bottom:3px solid var(--gold);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 70% at 50% 0%,rgba(184,148,63,.09),transparent 70%)}
.hero-in{max-width:1132px;margin:0 auto;position:relative}
.hero h1{color:var(--cream);max-width:760px}.hero h1 em{color:var(--gold-light)}
.hero .lede{color:var(--ink-faint)}
.hero .eyebrow{color:var(--gold)}
.units{display:grid;gap:14px;margin-top:8px}
.unit{display:grid;grid-template-columns:56px 1fr auto;gap:20px;align-items:center;background:var(--white);border:1px solid var(--border);border-radius:3px;padding:20px 24px}
.unit .num{font-family:'Playfair Display',serif;font-size:34px;font-weight:800;color:var(--gold)}
.unit h3{margin:0 0 2px;font-size:19px}
.unit p{font-size:14px;color:var(--ink-light);margin:0}
.unit.open{border-color:var(--gold);box-shadow:var(--shadow)}
.unit.locked{background:transparent;border-style:dashed}
.unit.locked .num{color:var(--ink-faint)}
.tag{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-light);border:1px solid var(--border);padding:4px 10px;border-radius:2px;white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:56px}
.about-box{border-top:2px solid var(--gold);padding-top:18px}

/* stat */
.stat{display:grid;gap:18px;margin:8px 0 28px;max-width:660px}
.bar{display:grid;grid-template-columns:1fr;gap:6px}
.bar span{font-size:14px;color:var(--ink-mid)}
.bar .track{height:44px;background:var(--cream-alt);border-radius:2px;overflow:hidden}
.bar .fill{height:100%;display:flex;align-items:center;padding-left:14px;font-family:'Playfair Display',serif;font-weight:800;font-size:22px;color:var(--cream);width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.bar.a .fill{background:var(--navy-light)}.bar.b .fill{background:var(--gold-dark)}

/* flip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:8px 0 12px}
.card{perspective:1200px;background:none;border:0;padding:0;text-align:left;min-height:330px;position:relative;color:inherit}
.card .in{position:absolute;inset:0;transition:transform .55s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;padding:20px;display:flex;flex-direction:column;overflow:auto}
.front{background:var(--white);border:1px solid var(--border)}
.front .k{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold-dark);letter-spacing:.12em;margin-bottom:10px}
.front h3{font-size:21px}
.front p{font-size:14px;color:var(--ink-light);flex:1;margin-top:6px}
.front .hint{font-size:12px;color:var(--gold-dark);font-family:'DM Mono',monospace;letter-spacing:.06em}
.back{transform:rotateY(180deg);background:var(--navy);color:var(--cream);border:1px solid var(--navy)}
.back h4{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}
.back .t h4{color:#8fd1ae}.back .j h4{color:#e7a79e}
.back p{font-size:13px;line-height:1.5;color:#dbe3ee;margin:0 0 12px}
.progress-note{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-light);letter-spacing:.04em}

/* callouts */
.callout{border-left:3px solid var(--gold);background:var(--gold-faint);padding:18px 22px;margin:24px 0;max-width:660px}
.callout p{margin:0!important;font-size:16px!important}
.core{background:var(--navy);color:var(--cream);padding:30px 32px;margin:28px 0;max-width:660px;border-bottom:3px solid var(--gold)}
.core span{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.core p{font-family:'Playfair Display',serif;font-size:clamp(21px,2.6vw,27px);line-height:1.3;margin:10px 0 0;color:var(--cream)!important;font-weight:700}
.case{background:var(--white);border:1px solid var(--border);padding:26px 30px;max-width:700px;margin:8px 0 28px}
.case p{font-size:16px;margin-bottom:14px;color:var(--ink-mid)}
.case .disp{font-size:13px;color:var(--ink-light);border-top:1px solid var(--border);padding-top:12px;margin:0}
.fiveq{display:grid;gap:10px;max-width:700px;margin-bottom:22px}
.q5{background:var(--white);border:1px solid var(--border);border-radius:3px}
.q5 button{width:100%;text-align:left;background:none;border:0;padding:14px 18px;display:flex;gap:14px;align-items:center;font-size:16px;font-weight:500;color:var(--ink)}
.q5 .qn{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold-dark)}
.q5 .a{display:none;padding:0 18px 16px 50px;font-size:14px;color:var(--ink-light)}
.q5.open .a{display:block}
textarea,input[type=text],input[type=email],select{width:100%;font-family:'DM Sans',sans-serif;font-size:16px;padding:12px 14px;border:1px solid var(--border);border-radius:2px;background:var(--white);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:500;color:var(--ink-mid);margin:14px 0 5px}

/* quiz */
.qwrap{max-width:700px}
.qmeta{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--ink-light);margin-bottom:12px;text-transform:uppercase}
.qdots{display:flex;gap:6px;margin-bottom:26px}
.qdots i{flex:1;height:4px;background:var(--border);border-radius:2px}
.qdots i.on{background:var(--gold)}.qdots i.c{background:var(--ok)}.qdots i.w{background:var(--bad)}
.qtext{font-family:'Playfair Display',serif;font-size:clamp(20px,2.6vw,26px);line-height:1.3;font-weight:700;margin-bottom:22px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:15px 18px;background:var(--white);border:1px solid var(--border);border-radius:3px;font-size:16px;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt .l{font-family:'DM Mono',monospace;font-size:12px;border:1px solid var(--border);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex:none;color:var(--ink-light);margin-top:-1px}
.opt.sel{border-color:var(--navy);background:var(--cream-alt)}
.opt.sel .l{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:20px;padding:18px 22px;border-radius:3px;font-size:15px}
.fb.ok{background:var(--ok-bg);border-left:3px solid var(--ok)}
.fb.no{background:var(--bad-bg);border-left:3px solid var(--bad)}
.fb strong{display:block;margin-bottom:4px}
.fb .src{margin-top:8px}

/* dashboard */
.dash{display:grid;grid-template-columns:240px 1fr;gap:20px;margin:12px 0 20px}
.panel{background:var(--white);border:1px solid var(--border);border-radius:3px;padding:24px}
.panel h3{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);margin-bottom:16px}
.ring{--p:0;width:168px;height:168px;border-radius:50%;margin:0 auto 14px;background:conic-gradient(var(--c,var(--gold)) calc(var(--p)*1%),var(--cream-alt) 0);display:grid;place-items:center}
.ring div{width:132px;height:132px;border-radius:50%;background:var(--white);display:grid;place-items:center;text-align:center;font-family:'Playfair Display',serif;font-size:38px;font-weight:800;line-height:1}
.ring small{display:block;font-family:'DM Mono',monospace;font-size:11px;font-weight:400;color:var(--ink-light);margin-top:4px}
.verdict{text-align:center;font-weight:600}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:14px}
.kv dt{color:var(--ink-light)}.kv dd{font-family:'DM Mono',monospace;text-align:right}
.dim{margin-bottom:16px}
.dim .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.dim .t{height:8px;background:var(--cream-alt);border-radius:4px;overflow:hidden}
.dim .t i{display:block;height:100%;background:var(--navy-light)}
.dim p{font-size:12.5px;color:var(--ink-light);margin-top:4px}
.review{list-style:none;display:grid;gap:8px}
.review li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;font-size:14px;align-items:start;padding-bottom:8px;border-bottom:1px solid var(--cream-alt)}
.review .m{font-weight:700}.review .m.c{color:var(--ok)}.review .m.w{color:var(--bad)}
.record{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.5;color:var(--ink-mid);border-left:2px solid var(--gold);padding-left:16px;white-space:pre-wrap}
.sample{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-light)}

/* credential tracker */
.track-list{list-style:none;display:grid;gap:0}
.track-list li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--cream-alt);font-size:15px}
.track-list li:last-child{border-bottom:0}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;font-size:12px;color:var(--ink-faint)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.cur{border-color:var(--gold);color:var(--gold-dark)}
.cert{position:relative;overflow:hidden;border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:-8px;padding:30px 26px 26px;text-align:center;background:var(--cream)}
.cert .org{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dark)}
.cert .ttl{display:block;font-family:'Playfair Display',serif;font-weight:800;font-size:24px;color:var(--navy);margin:8px 0 4px;line-height:1.15}
.cert .nm{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:var(--ink-mid);margin:10px 0 4px;border-bottom:1px solid var(--border);display:inline-block;padding:0 22px 2px}
.cert .sm{font-size:12.5px;color:var(--ink-light);margin:8px auto 0;max-width:330px}
.cert .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:'Playfair Display',serif;font-weight:800;font-size:68px;letter-spacing:.12em;color:rgba(154,59,50,.16);transform:rotate(-18deg)}
.cert-note{font-size:13px;color:var(--ink-light);margin-top:12px}
/* waitlist */
.wl{background:var(--navy);color:var(--cream);padding:34px 36px;margin-top:36px;border-bottom:3px solid var(--gold);max-width:760px}
.wl h2{font-family:'Playfair Display',serif;font-size:28px;color:var(--cream);margin-bottom:8px}
.wl p{color:var(--ink-faint);font-size:15px;max-width:540px}
.wl label.f{color:#cdd6e2}
.wl .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.wl .chk{display:flex;gap:10px;align-items:flex-start;margin:16px 0 4px;font-size:13px;color:#cdd6e2}
.wl .chk input{margin-top:4px;accent-color:var(--gold)}
.wl .msg{margin-top:14px;font-size:14px}
.wl .msg.err{color:#f0b3aa}.wl .msg.ok{color:#8fd1ae}
.hp{position:absolute;left:-9999px}

footer{background:var(--navy);color:var(--ink-faint);font-size:13px;padding:28px 24px;text-align:center;border-top:3px solid var(--gold)}
footer a{color:var(--gold-light)}

@media(max-width:900px){
  .shell{grid-template-columns:1fr;gap:20px;padding-top:20px}
  .outline{display:none}
  .mobile-bar{display:flex;justify-content:space-between;align-items:center;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-light);gap:12px}
  .mobile-bar button{background:none;border:0;font:inherit;color:var(--gold-dark);text-decoration:underline;text-transform:none;letter-spacing:0}
  .two,.dash{grid-template-columns:1fr}
  .unit{grid-template-columns:44px 1fr;}.unit .tag,.unit .btn{grid-column:2}
  .wl .grid{grid-template-columns:1fr}
  .brand small{display:none}.top-r a{display:none}.top-r a.dl{display:inline}
  .hero{margin-top:-20px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

  var dims={};QUIZ.forEach(function(q,i){var d=dims[q.tag]=dims[q.tag]||{r:0,t:0};d.t++;if(last.ans[i]===q.a)d.r++;});
  h+='<div class="panel"><h3>How you reasoned</h3>';
  Object.keys(DIMS).forEach(function(k){var d=dims[k];if(!d)return;h+='<div class="dim"><div class="h"><span>'+DIMS[k].n+'</span><span class="sample" style="font-family:DM Mono,monospace">'+d.r+' of '+d.t+'</span></div><div class="t"><i style="width:'+Math.round(d.r/d.t*100)+'%"></i></div><p>'+DIMS[k].d+'</p></div>';});
  h+='</div></div>';
  h+='<div class="dash" style="grid-template-columns:1fr 1fr"><div class="panel"><h3>Question review</h3><ul class="review">';
  QUIZ.forEach(function(q,i){var c=last.ans[i]===q.a;h+='<li><span class="m '+(c?'c':'w')+'">'+(c?'✓':'✗')+'</span><span>'+esc(q.q.length>110?q.q.slice(0,107)+'…':q.q)+'</span><span class="sample">Q'+(i+1)+'</span></li>';});
  h+='</ul></div><div class="panel"><h3>Your reflection on the case</h3>'
  +(S.reflect&&S.reflect.trim()?'<div class="record" id="rec"></div><p class="sample" style="margin-top:12px">Written by you. Stored only in this browser.</p>':'<p class="muted">You did not write a reflection. Add one in the case study and it will appear here.</p><div class="row" style="margin-top:12px"><button class="btn ghost" data-go="#/unit-1/case">Go to the case study</button></div>')
  +'</div></div>';
  h+='<div class="row">'+(ok?'<a class="btn" href="#waitlist" data-go="#/waitlist">Get Units 2 to 5 when they open</a>':(S.attempts.length<MAXTRIES?'<button class="btn" data-go="#/unit-1/quiz">Try the quiz again</button>':''))+'<button class="btn ghost" data-go="#/unit-1/figure">Review Figure 1.1</button></div>';
  h+=waitlistHTML();
  h+='<p style="margin-top:28px"><button class="link" id="reset">Reset this preview (clears saved progress)</button></p>';
  $('#main').innerHTML=h;
  var r=$('#rec');if(r)r.textContent=S.reflect;
  $('#reset').addEventListener('click',function(){S={flipped:[],reflect:'',attempts:[],joined:S.joined,visited:{}};save();run=null;go('#/');route();});
  bindWaitlist();
}

function viewFull(){
  var h=mobileBar('full')+'<span class="eyebrow">Full unit</span><h1>Unit 1: The Dream of AI Governance <em>vs. Reality</em></h1><div class="prose">'
  +'<h3 style="margin-top:24px">The premiere of AI governance theater</h3>'
  +'<p>It can seem like many companies run before they can walk when it comes to artificial intelligence implementation and deployment. Before a business integrates AI into its workflow, it often implements an AI governance policy: a set of rules, constraints, and best practices that defines how AI can be used, who is accountable for its outcomes, and what happens when something goes wrong.</p>'
  +'<p><strong>What’s in an AI governance policy?</strong></p><ul style="margin:0 0 16px 22px;color:var(--ink-mid);font-size:17px">'+FIG.map(function(f){return '<li style="margin-bottom:6px"><strong>'+f.k+'</strong>: '+f.d+'</li>';}).join('')+'</ul>'
  +'<p>Commonly, a company will also include information about who needs to learn the policy, as well as how often it should be updated as laws and industry tools change.</p>'
  +'<p>This all sounds wonderful in theory. In a May 2026 AAA-ICDR study of 500 senior legal and executive leaders, 87% of organizations had formal AI governance policies, though only 22% said those structures worked in practice. More than half described good structures with inconsistent execution.</p>'
  +'<h3 style="margin-top:28px">Ethicswashing meets real life</h3>'
  +'<p>The efficacy of AI governance policy depends on a lot of moving parts, and there is a lot of opportunity for failure. Every policy inclusion also has a possible breaking point that prevents success. This results in AI use that is largely lawless, difficult to wrangle, and ripe for potentially costly mishaps.</p>'
  +'<p>AI governance policy may also fall short in areas such as mitigating bias and environmental impact management. In the 2026 AI Company Data Initiative report from the Thomson Reuters Foundation and UNESCO, which reviewed 2,972 companies, only 11% reported carrying out environmental impact assessments for their AI systems. This, in turn, means there is an increased chance of a gap once it is time to write any sort of AI governance policy.</p>'
  +'<p>None of this means AI governance policies are useless. Instead, it means a policy is a promise, and promises are cheap. The companies that thrive treat their policy as a living practice: owned, enforced, revisited, and honest about what it covers.</p>'
  +'<p>When you evaluate any organization’s AI ethics, including your own employer’s, the question is never, “Does this company have good values?” Values cost nothing, after all. The question is: does the documented behavior match the documented commitment?</p>'
  +'<p class="src">Sources: AAA-ICDR, <a href="https://www.adr.org/news-and-insights/ai-governance-gap" target="_blank" rel="noopener">AI governance gap</a>, May 2026. Thomson Reuters Foundation and UNESCO, <a href="https://doi.org/10.54678/YJWP8855" target="_blank" rel="noopener">Responsible AI in practice: 2025 global insights from the AI Company Data Initiative</a>. ACLU and Public Justice complaint to the EEOC and Colorado Civil Rights Division, March 2025.</p></div>'
  +'<div class="row"><button class="btn" data-go="#/unit-1/gap">Take the guided version</button><button class="btn ghost" data-go="#/unit-1/quiz">Go to the quiz</button></div>';
  $('#main').innerHTML=h;
}

/* ---------- waitlist ---------- */
function waitlistHTML(){
  if(S.joined)return '<section class="wl" id="waitlist"><h2>You’re on the list.</h2><p>Thank you. We will email you when Units 2 to 5 open.</p></section>';
  return '<section class="wl" id="waitlist"><h2>Units 2 to 5 are coming.</h2><p>Join the AIF waitlist and we will tell you when the rest of the course, and the credential, opens.</p>'
  +'<form id="wlf" novalidate><div class="grid"><div><label class="f" for="wn">Name</label><input type="text" id="wn" name="name" autocomplete="name" required /></div>'
  +'<div><label class="f" for="we">Email</label><input type="email" id="we" name="email" autocomplete="email" required /></div></div>'
  +'<label class="f" for="wi">Industry (optional)</label><select id="wi" name="industry"><option value="">Select…</option>'+INDUSTRIES.map(function(i){return '<option>'+i+'</option>';}).join('')+'</select>'
  +'<input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />'
  +'<label class="chk"><input type="checkbox" id="wc" /> <span>I agree to be emailed about Ponder AI Ethics Fundamentals and The Present Company. I can unsubscribe any time.</span></label>'
  +'<div class="row" style="margin-top:18px"><button class="btn" type="submit" id="wb">Join the waitlist</button></div><div class="msg" id="wm" role="status"></div></form></section>';
}
function bindWaitlist(){
  var f=$('#wlf');if(!f)return;
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var m=$('#wm'),name=f.name.value.trim(),email=f.email.value.trim();
    m.className='msg';
    if(!name){m.className='msg err';m.textContent='Please add your name.';return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){m.className='msg err';m.textContent='Please enter a valid email address.';return;}
    if(!$('#wc').checked){m.className='msg err';m.textContent='Please tick the box so we know it’s OK to email you.';return;}
    var b=$('#wb');b.disabled=true;b.textContent='Sending…';
    fetch('/api/waitlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,email:email,industry:f.industry.value,consent:true,website:f.website.value,source:'Ponder page'})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok&&j.ok};}).catch(function(){return {ok:false};});})
    .then(function(r){
      if(r.ok){S.joined=true;save();$('#waitlist').outerHTML=waitlistHTML();}
      else{b.disabled=false;b.textContent='Join the waitlist';m.className='msg err';m.innerHTML='We could not save that just now. Please try again, or email <a style="color:var(--gold-light)" href="mailto:jponder@thepresentco.com?subject=Ponder%20AIF%20waitlist">jponder@thepresentco.com</a> and we will add you.';}
    })
    .catch(function(){b.disabled=false;b.textContent='Join the waitlist';m.className='msg err';m.innerHTML='We could not reach the server. Please try again, or email <a style="color:var(--gold-light)" href="mailto:jponder@thepresentco.com?subject=Ponder%20AIF%20waitlist">jponder@thepresentco.com</a>.';});
  });
}

/* ---------- router ---------- */
function route(){
  var h=location.hash||'#/',m;
  if(h==='#/waitlist'||h==='#waitlist'){h='#/';viewHome();var w=$('#waitlist');if(w)w.scrollIntoView({behavior:'smooth'});return;}
  if(h==='#/dashboard'){setShell(false);outline('dashboard');setMeter('');viewResults(true);window.scrollTo(0,0);return;}
  m=h.match(/^#\/unit-1\/(\w+)/);
  if(!m){viewHome();window.scrollTo(0,0);return;}
  var id=m[1];setShell(false);
  if(id!=='quiz'&&id!=='results'&&id!=='full'&&STEPS.some(function(s){return s.id===id;})){S.visited[id]=true;save();}
  outline(id);setMeter(id);
  ({gap:viewGap,figure:viewFigure,promise:viewPromise,case:viewCase,quiz:viewQuiz,results:viewResults,full:viewFull}[id]||viewGap)();
  window.scrollTo(0,0);
  var mn=$('#main');mn.focus({preventScroll:true});
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go]');if(!t)return;
  e.preventDefault();var g=t.getAttribute('data-go');
  if(location.hash===g)route();else go(g);
});
window.addEventListener('hashchange',route);
route();
})();
</script>
